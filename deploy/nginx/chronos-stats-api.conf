# Paste inside the `server { ... }` block of /etc/nginx/sites-enabled/default,
# next to the existing `location /api/status` block.
# Do NOT add no-cache headers here: the API sends its own Cache-Control/ETag.
location /api/stats/ {
    proxy_pass http://127.0.0.1:8765/api/stats/;
    proxy_set_header Host $host;
}

# Player heads (bot/heads.py writes <website_path>/cache/heads/<uuid>.png).
# try_files ... =404: a head not downloaded yet must be a real 404 (the site then
# falls back to Crafatar), not the site's /404.html page with status 200 that
# `location /` gives. Heads refresh daily, hence the short expiry.
location /cache/heads/ {
    root /var/www/html;
    expires 1d;
    add_header Cache-Control "public";
    types { image/png png; }
    default_type image/png;
    try_files $uri =404;
}
