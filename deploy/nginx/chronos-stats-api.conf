# Paste inside the `server { ... }` block of /etc/nginx/sites-enabled/default,
# next to the existing `location /api/status` block.
# Do NOT add no-cache headers here: the API sends its own Cache-Control/ETag.
location /api/stats/ {
    proxy_pass http://127.0.0.1:8765/api/stats/;
    proxy_set_header Host $host;
}
